title: Hayato Tagawa
description: Personal homepage of Hayato Tagawa.
lang: en
url: https://HayaTaga.github.io
baseurl: /HayaTaga
max_width: 930px

include:
  - _pages

exclude:
  - .claude/
  - .github/
  - .gitignore
  - .jekyll-cache/
  - .jekyll-metadata
  - .ruby-version
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor/

plugins:
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM

sass:
  style: compressed
